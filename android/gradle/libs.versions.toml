# Every version: latest stable release at least two weeks old on 2026-11-05. Nothing dynamic.
[versions]
agp = "9.5.1"                 # released 2026-09-18
firebaseMessaging = "26.0.1"  # 2026-10-21
junit = "4.13.2"              # 2021-02-13
robolectric = "4.17"          # 2026-09-10
androidxTestRunner = "1.7.0"  # 2025-07-30
androidxTestRules = "1.7.0"   # 2025-07-30
androidxTestExtJunit = "1.3.0" # 2025-07-30
androidxTestOrchestrator = "1.6.1" # 2025-08-01
uiautomator = "2.4.0"         # 2026-07-01
googleServices = "4.5.0"      # 2026-06-16

[libraries]
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
