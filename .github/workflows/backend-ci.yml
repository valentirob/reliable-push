name: Backend CI

# Build, unit + integration tests, JaCoCo gate, container image + Trivy scan, dependency review.
# End-to-end tests never run here: they run locally (./scripts/e2e.sh) and are reported in the PR (spec 10.1).

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit tests (surefire) + integration tests (failsafe, Testcontainers PostgreSQL) + JaCoCo 80% line gate
      - name: Maven verify
        run: ./mvnw -B verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Container image and Trivy scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -Pimage builds reliable-push-backend:<version> with docker and runs only the @Tag("image") ITs.
      # The unit tests already ran in the build job; -Dtest=NoSuchTest turns surefire into a no-op without
      # touching failsafe (-DskipTests would also skip the image ITs).
      - name: Build image and run image tests
        run: ./mvnw -B verify -Pimage -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Resolve image name
        id: image
        run: echo "name=$(./mvnw -B -q help:evaluate -Dexpression=image.name -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Trivy runs from its official image, pinned by tag. trivy-action/setup-trivy fetch Trivy's
      # install script from the unpinned main branch, which broke installation (exit 6) in Nov 2026.
      # Bump TRIVY_VERSION by hand: Dependabot does not track images referenced in run steps.
      - name: Trivy image scan
        env:
          TRIVY_VERSION: 0.76.1
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
