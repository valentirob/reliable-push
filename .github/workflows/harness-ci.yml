name: Client and harness CI

# Builds and tests the Java sender client (client-java), the Java 8 payload library (payload-java, tests run on a
# Java 8 and a Java 21 JVM), the local test harness (harness) and the load-test module
# (loadtest: compiles the Gatling simulations and runs its unit tests, never Gatling itself).
# End-to-end tests never run here: they need the full docker-compose stack and run locally
# (./scripts/e2e.sh); the result is reported in the PR (spec 10.1). The console smoke test (Playwright)
# is not part of the default build either, and neither are the load runs (./scripts/load.sh, local only).

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'client-java/**'
      - 'payload-java/**'
      - 'harness/**'
      - 'loadtest/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/harness-ci.yml'
  pull_request:
    paths:
      - 'client-java/**'
      - 'payload-java/**'
      - 'harness/**'
      - 'loadtest/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/harness-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built with JDK 21 but compiled with --release 17, so it only uses the Java 17 API. Its enforcer rule
      # fails the build if the client ever gains a runtime dependency.
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify (client-java)
        run: ./mvnw -B -pl client-java verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-reports
          path: client-java/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  payload-java:
    name: Payload (tests on Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 21]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Maven itself and the build plugins run on JDK 21 (the last version listed becomes JAVA_HOME); the library is
      # compiled with --release 8. JDK 8 is installed beside it (JAVA_HOME_8_X64) so that the matrix leg "8" really
      # executes the tests on a Java 8 JVM, through Surefire's `jvm` property.
      - name: Set up Java 8 and 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: maven

      - name: Maven verify (payload-java), tests on Java ${{ matrix.java }}
        run: |
          if [ "${{ matrix.java }}" = "8" ]; then
            "$JAVA_HOME_8_X64/bin/java" -version
            ./mvnw -B -pl payload-java verify -Djvm="$JAVA_HOME_8_X64/bin/java"
          else
            ./mvnw -B -pl payload-java verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-reports-java${{ matrix.java }}
          path: payload-java/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  harness:
    name: Harness (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Default build: unit tests (surefire) + integration tests (failsafe, Spring on random ports, no Docker) + coverage gate; the Playwright console smoke test (profile console-smoke)
      # is excluded and needs a running stack.
      - name: Maven verify (harness and the modules it needs)
        run: ./mvnw -B -pl harness -am verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-reports
          path: |
            harness/target/surefire-reports/
            harness/target/failsafe-reports/
            harness/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  loadtest:
    name: Loadtest (compile + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles the simulations (test sources) and runs the unit tests; the Gatling plugin is bound to no phase, so no
      # load is ever generated here.
      - name: Maven verify (loadtest)
        run: ./mvnw -B -pl loadtest verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest-reports
          path: loadtest/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
