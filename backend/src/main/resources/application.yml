spring:
  application:
    name: reliable-push
  # Runs both roles unless overridden (SPRING_PROFILES_ACTIVE=api or worker).
  profiles:
    default: api,worker
  threads:
    virtual:
      enabled: true
  main:
    # stdout carries only JSON log lines (spec 9.1)
    banner-mode: off
  flyway:
    enabled: true

server:
  tomcat:
    # JSON request bodies are limited to 64 KB by a filter added in the sender-API task
    # (plan Task 6, test bodyOver64KbIs413); this only bounds how much Tomcat swallows of an aborted upload.
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Logging profile (json | local) is selected in log4j2-spring.xml: ECS JSON unless the "local" profile is active.
