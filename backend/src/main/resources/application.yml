spring:
  application:
    name: reliable-push
  # Runs both roles unless overridden (SPRING_PROFILES_ACTIVE=api or worker).
  profiles:
    default: api,worker
  threads:
    virtual:
      enabled: true
  main:
    # stdout carries only JSON log lines (spec 9.1)
    banner-mode: off
  flyway:
    enabled: true
  servlet:
    multipart:
      # the API is JSON-only: with multipart handling on, the container would parse (and spool to disk) any
      # multipart/* body of up to 10 MB before BodySizeLimitFilter's stream wrapper ever sees it
      enabled: false

server:
  tomcat:
    # JSON request bodies are limited to 64 KB by BodySizeLimitFilter (/v1/**);
    # this only bounds how much Tomcat swallows of an upload the filter rejected unread.
    max-swallow-size: 64KB
    # same reason for application/x-www-form-urlencoded: bounded like every other body (default is 2 MB)
    max-http-form-post-size: 64KB

# Filtered by Maven; the webhook User-Agent carries it (reliable-push/<version>).
info:
  app:
    version: "@project.version@"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Logging profile (json | local) is selected in log4j2-spring.xml: ECS JSON unless the "local" profile is active.
