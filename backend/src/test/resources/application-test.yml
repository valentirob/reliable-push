# Test-only configuration: activate with the Spring profile "test" (in addition to the profiles the test needs).
# Every value here is a throwaway test value, never a real secret. Secret refs follow the production rule (env:NAME);
# in tests NAME is satisfied by the plain property at the bottom of this file instead of a real environment variable.
reliable-push:
  device-token:
    # No key is committed: the PEMs behind these refs are generated per JVM (TestKeys.newEcPemPair) and supplied by
    # PostgresTestBase (ITs) or the test itself (see TestProfileConfigTest). A second key for rotation tests is
    # configured per test.
    signing-keys:
      - kid: test-k1
        private-key-pem-ref: env:RP_TEST_DEVICE_KEY_K1
        public-key-pem-ref: env:RP_TEST_DEVICE_PUB_K1
    current-kid: test-k1
    # no revocation cache in tests: a revocation or re-registration is visible to the very next request
    revocation-cache-ttl: 0s
  worker:
    poll-interval: 200ms
  fallback:
    circuit-breaker:
      # off in tests: the background workers of every cached context (poll 200 ms) would otherwise all evaluate the
      # test apps under advisory lock 4242002 and suppress each other's rows; the circuit ITs turn it on explicitly
      enabled: false
  admin:
    rollup:
      # never fire the nightly rollup inside a test JVM (DailyRollupIT calls run() directly)
      cron: "-"
  retention:
    # never fire the daily purge inside a test JVM (RetentionJobIT calls purge() directly)
    cron: "-"
  apps:
    shop:
      # SHA-256 of the raw test key "test-sender-key-shop" (tests send that raw key in X-Api-Key)
      sender-api-key-sha256: 08017068a4fbb11fcf4856923e4ba6b63a02e8313c7aa3a59d1d1c2a2e354fce
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile
        user-claim: sub
        # jwks-uri is set per test (WireMock listens on a random port)
      fallback:
        # url is set per test (WireMock listens on a random port)
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # A second app with default limits, for cross-app isolation tests (NotificationApiIT).
    # Key: SHA-256 of the raw test key "test-sender-key-other".
    other:
      sender-api-key-sha256: 47d5b1f25c55bbe7ee9dfcdbe5e41a63d49ae6b74da5519f177c29f0b8db2c4b
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: other-mobile
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # Used by SenderApiKeyIT.rateLimited429: only two sender requests per minute.
    # Key: SHA-256 of the raw test key "test-sender-key-limited".
    ratelimited:
      sender-api-key-sha256: 38632174bb526248fb3b98f2b30cae027ac13a921da41d6b4881052b70edbb4c
      rate-limits:
        sender-per-minute: 2
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: ratelimited-mobile
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # Device API tests (DeviceApiIT). identity.issuer is replaced by the FakeOidc issuer (random localhost port) via
    # @DynamicPropertySource; the value here only satisfies validation.
    # Key: SHA-256 of the raw test key "test-sender-key-deviceit".
    deviceit:
      sender-api-key-sha256: 9c0f50356e61116e4505c77c9dbff8892b0b3165145410237f9b69a25f17a38e
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile-it
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # A second app on the same identity provider, for cross-app device id tests (DeviceApiIT).
    # Key: SHA-256 of the raw test key "test-sender-key-deviceother".
    deviceother:
      sender-api-key-sha256: 62b26a734f5e429dc0d24482fec5e4d59f6809a286dfe7c9aa614486f1d3de24
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile-other
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # Used by DeviceApiIT.registerRateLimitedPerApp: registration allows device-per-minute = 1 request per minute per user.
    # Key: SHA-256 of the raw test key "test-sender-key-deviceregister".
    deviceregister:
      sender-api-key-sha256: ea2147f6f94e572766cf77b92151241a4a221b9b25d3942f5439a944b91e973f
      rate-limits:
        device-per-minute: 1
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile-register
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # Used by DeviceApiIT.deviceRateLimited429: only two device requests per minute (registration: 2 per minute per user).
    # Key: SHA-256 of the raw test key "test-sender-key-devicelimited".
    devicelimited:
      sender-api-key-sha256: 510f70f5a6fcb46ef0602becb1c21d3ae4237723590312ddb078596498f19459
      rate-limits:
        device-per-minute: 2
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile-limited
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET
    # Used by DeviceApiIT.identityProviderOutage503: its identity provider (FakeOidc, issuer set per test class) has no JWKS.
    # Key: SHA-256 of the raw test key "test-sender-key-devicedown".
    devicedown:
      sender-api-key-sha256: 263694706a195db96f0e1cedbc68f4a8f64ee6b4124b9b38faf02df01fd21c6f
      identity:
        type: oidc
        issuer: https://idp.test.example
        audience: shop-mobile-down
      fallback:
        url: http://localhost:9/hook
        hmac-secret-ref: env:RP_TEST_SHOP_HOOK_SECRET

# Value behind the env: reference above. Deliberately obvious test value.
RP_TEST_SHOP_HOOK_SECRET: test-only-hook-secret-shop
