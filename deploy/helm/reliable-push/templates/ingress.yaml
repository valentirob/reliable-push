{{- if .Values.ingress.enabled }}
{{- /* Only the public API prefix (and the ops dashboard page /admin) is routed, to the API Service; /actuator and port 8081 are never exposed. */ -}}
{{- $adminKeys := dig "admin" "keys" (list) .Values.config }}
{{- range $h := .Values.ingress.hosts }}
{{- range $p := $h.paths }}
{{- if not (or (eq $p "/v1") (hasPrefix "/v1/" $p) (eq $p "/admin") (hasPrefix "/admin/" $p)) }}
{{- fail (printf "ingress.hosts: path %q is not allowed, only /v1, /admin and their sub-paths are routed" $p) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rp.fullname" . }}
  labels:
    {{- include "rp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $h := .Values.ingress.hosts }}
    - host: {{ $h.host | quote }}
      http:
        paths:
          {{- range $p := $h.paths }}
          - path: {{ $p | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "rp.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
          {{- if and $adminKeys (not (has "/admin" $h.paths)) }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "rp.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
