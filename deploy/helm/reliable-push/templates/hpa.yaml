{{- if .Values.autoscaling.api.enabled }}
{{- /* CPU autoscaling for the API only: worker scaling follows the backlog, not CPU. In combined mode the combined
Deployment (API and worker in one pod) is the target. */ -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rp.fullname" . }}-api
  labels:
    {{- include "rp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rp.fullname" . }}{{ ternary "-api" "" (eq .Values.mode "split") }}
  minReplicas: {{ .Values.autoscaling.api.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.api.targetCPUUtilizationPercentage }}
{{- end }}
