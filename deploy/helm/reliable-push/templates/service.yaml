apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}-api
  labels:
    {{- include "rp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "rp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "rp.apiComponent" . }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rp.fullname" . }}-management
  labels:
    {{- include "rp.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  selector:
    {{- include "rp.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
