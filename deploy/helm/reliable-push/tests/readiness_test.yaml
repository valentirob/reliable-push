suite: helm test pod
templates:
  - tests/test-readiness.yaml
values:
  - ../ci/default-values.yaml
release:
  name: rp
tests:
  - it: probes the management readiness endpoint as a helm test hook
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.name
          value: rp-reliable-push-test-readiness
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: spec.restartPolicy
          value: Never
      - equal:
          path: spec.containers[0].command
          value:
            - wget
            - -qO-
            - http://rp-reliable-push-management:8081/actuator/health/readiness
      - matchRegex:
          path: spec.containers[0].image
          pattern: "^busybox:[0-9.]+@sha256:[0-9a-f]{64}$"
  - it: runs non-root with the hardened security context
    asserts:
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      - equal:
          path: spec.automountServiceAccountToken
          value: false
  - it: keeps the UID of podSecurityContext (GKE)
    values:
      - ../values-gke.yaml
    asserts:
      - equal:
          path: spec.securityContext.runAsUser
          value: 1001
  - it: sets no fixed UID, GID or fsGroup with the OpenShift values
    values:
      - ../values-openshift.yaml
    asserts:
      - notExists:
          path: spec.securityContext.runAsUser
      - notExists:
          path: spec.securityContext.runAsGroup
      - notExists:
          path: spec.securityContext.fsGroup
      - notExists:
          path: spec.containers[0].securityContext.runAsUser
