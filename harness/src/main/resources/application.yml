spring:
  application:
    name: reliable-push-harness
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  web:
    resources:
      static-locations: classpath:/static/console/

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health

harness:
  backend-url: ${HARNESS_BACKEND_URL:http://localhost:8080}
  backend-log-dir: ${HARNESS_BACKEND_LOG_DIR:/tmp/rp-logs}
  # Environment variables (use these exact dash-less names; Task 11 GenSecrets and compose follow them):
  #   HARNESS_BACKENDURL, HARNESS_BACKENDLOGDIR (HARNESS_BACKEND_URL / HARNESS_BACKEND_LOG_DIR also work via the
  #   placeholders above), and per app <ID>: HARNESS_APPS_<ID>_SENDERAPIKEY, _GRANTSECRET, _HMACSECRET, _GRANTISSUER.
  # Optional: HARNESS_MINUTESECONDS (harness.minute-seconds, default 60; 1 = the backend's fast clock) and per app
  # HARNESS_APPS_<ID>_TRIGGERWINDOWMINUTES (default 20): console countdowns only, they must mirror the backend.
  # At least one app is required. Pinned by HarnessPropertiesEnvBindingTest.
  # Optional: HARNESS_DEVICEPROXYTARGET (harness.device-proxy-target, e.g. http://api:8080) starts the TCP proxy the iOS
  # Simulator uses to reach the backend (HARNESS_DEVICEPROXYPORT, default 8091). Unset: no proxy, the switch only remembers.
  # HARNESS_DEVICEPROXYBIND (default 127.0.0.1): the proxy's listen address; compose sets 0.0.0.0 inside the container,
  # where Docker publishes it on 127.0.0.1:8091 only. Never 0.0.0.0 outside a container: it would expose the backend.
  # Optional: HARNESS_ADMINKEY (harness.admin-key): the raw admin key of the backend's ops dashboard (X-Admin-Key) for the
  # admin-dashboard scenario; generated per run by GenSecrets.java. Secret, never printed. Unset: that scenario fails.
