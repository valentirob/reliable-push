<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">reliable-push at a glance</title>
  <desc id="desc">Your backend sends pushes through FCM and APNs to an iPhone and an Android phone, as today. It also registers each push with the reliable-push backend. A tracking module in each app reports DELIVERED when the push arrives and READ when it is tapped. If the policy is not met before the timeout, the reliable-push worker calls your signed fallback webhook, and your fallback service sends an SMS or an email. A per-app circuit breaker in front of the webhook stops the fallbacks of an app whose delivery tracking is missing, so an outage does not turn into a storm of needless SMS. The ops dashboard shows each app's circuit.</desc>
  <defs>
    <marker id="m-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="m-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="m-fall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="m-fall-sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="60" y="50" font-size="30" font-weight="700" fill="#0f172a">reliable-push at a glance</text>
  <text x="60" y="78" font-size="16" fill="#475569">A sidecar: your backend keeps sending pushes. reliable-push only tracks them and triggers a fallback.</text>
  <g font-size="14" fill="#334155">
    <line x1="60" y1="104" x2="100" y2="104" stroke="#2563eb" stroke-width="4"/><text x="108" y="109">your push path (unchanged)</text>
    <line x1="310" y1="104" x2="350" y2="104" stroke="#0d9488" stroke-width="4"/><text x="358" y="109">reliable-push tracking (sidecar)</text>
    <line x1="590" y1="104" x2="630" y2="104" stroke="#dc2626" stroke-width="4"/><text x="638" y="109">fallback</text>
  </g>

  <!-- Your backend (sender) -->
  <g filter="url(#shadow)"><rect x="60" y="130" width="360" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text x="240" y="166" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Your backend</text>
  <text x="240" y="188" font-size="14" fill="#1e40af" text-anchor="middle">(push sender, unchanged)</text>
  <g font-size="14" fill="#334155">
    <text x="84" y="220">• sends pushes via FCM / APNs, as today</text>
    <text x="84" y="244">• adds one call: register the push ①</text>
    <text x="84" y="268">• puts rp_tid in the push payload</text>
    <text x="84" y="292">• register fails? send it anyway</text>
  </g>

  <!-- FCM / APNs -->
  <g filter="url(#shadow)"><rect x="600" y="150" width="360" height="140" rx="70" fill="#f8fafc" stroke="#64748b" stroke-width="2"/></g>
  <text x="780" y="200" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">FCM / APNs</text>
  <text x="780" y="226" font-size="14" fill="#475569" text-anchor="middle">Google and Apple push services</text>
  <text x="780" y="250" font-size="14" fill="#475569" text-anchor="middle">APNs → iPhone · FCM → Android</text>

  <!-- ② sender → FCM/APNs -->
  <line x1="420" y1="220" x2="594" y2="220" stroke="#2563eb" stroke-width="4" marker-end="url(#m-main)"/>
  <text x="507" y="206" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">② send push</text>
  <text x="507" y="244" font-size="13" fill="#1e40af" text-anchor="middle">+ rp_tid</text>

  <!-- ③ FCM/APNs → phones -->
  <line x1="960" y1="230" x2="1124" y2="230" stroke="#2563eb" stroke-width="4" marker-end="url(#m-main)"/>
  <path d="M930,164 L930,130 L1465,130 L1465,144" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#m-main)"/>
  <text x="1042" y="216" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">③ deliver</text>
  <text x="1042" y="122" font-size="13" fill="#1e40af" text-anchor="middle">③ deliver</text>

  <!-- iPhone -->
  <g filter="url(#shadow)"><rect x="1130" y="150" width="210" height="430" rx="34" fill="#0f172a"/></g>
  <rect x="1141" y="161" width="188" height="408" rx="26" fill="#f8fafc"/>
  <rect x="1200" y="168" width="70" height="16" rx="8" fill="#0f172a"/>
  <text x="1235" y="208" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">iPhone · iOS 15+</text>
  <rect x="1152" y="222" width="166" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1235" y="246" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Your iOS app</text>
  <g font-size="12.5" fill="#334155">
    <text x="1164" y="270" font-weight="600" fill="#0f766e">ReliablePush SDK</text>
    <text x="1164" y="292">• registers the device</text>
    <text x="1164" y="312">• READ when tapped</text>
    <text x="1164" y="330" fill="#64748b">shows pushes as today</text>
  </g>
  <rect x="1152" y="352" width="166" height="204" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="1235" y="376" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">Tracking module</text>
  <g font-size="12.5" fill="#334155">
    <text x="1164" y="398" fill="#0f766e" font-weight="600">Notification Service</text>
    <text x="1164" y="414" fill="#0f766e" font-weight="600">Extension</text>
    <text x="1164" y="438">• DELIVERED as soon</text>
    <text x="1164" y="456">  as the push arrives,</text>
    <text x="1164" y="474">  even if the app is</text>
    <text x="1164" y="492">  closed</text>
    <text x="1164" y="516">• at most 5 s, the</text>
    <text x="1164" y="534">  push is always shown</text>
  </g>

  <!-- Android phone -->
  <g filter="url(#shadow)"><rect x="1360" y="150" width="210" height="430" rx="26" fill="#1f2937"/></g>
  <rect x="1371" y="161" width="188" height="408" rx="18" fill="#f8fafc"/>
  <circle cx="1465" cy="176" r="6" fill="#1f2937"/>
  <text x="1465" y="208" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Android 8+</text>
  <rect x="1382" y="222" width="166" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1465" y="246" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Your Android app</text>
  <g font-size="12.5" fill="#334155">
    <text x="1394" y="270" font-weight="600" fill="#0f766e">ReliablePush SDK</text>
    <text x="1394" y="292">• registers the device</text>
    <text x="1394" y="312">• READ when tapped</text>
    <text x="1394" y="330" fill="#64748b">shows pushes as today</text>
  </g>
  <rect x="1382" y="352" width="166" height="204" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="1465" y="376" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">Tracking module</text>
  <g font-size="12.5" fill="#334155">
    <text x="1394" y="398" fill="#0f766e" font-weight="600">hook in your Firebase</text>
    <text x="1394" y="414" fill="#0f766e" font-weight="600">MessagingService</text>
    <text x="1394" y="438">• DELIVERED as soon</text>
    <text x="1394" y="456">  as the push arrives,</text>
    <text x="1394" y="474">  even if the app is</text>
    <text x="1394" y="492">  killed</text>
    <text x="1394" y="516">• offline: queued and</text>
    <text x="1394" y="534">  retried later</text>
  </g>

  <!-- ④ phones → reliable-push -->
  <path d="M1465,580 L1465,660 L1235,660" fill="none" stroke="#0d9488" stroke-width="4"/>
  <path d="M1235,580 L1235,660 L1026,660" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#m-side)"/>
  <text x="1118" y="646" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">④ DELIVERED · READ</text>
  <text x="1118" y="682" font-size="13" fill="#115e59" text-anchor="middle">device token (JWT)</text>

  <!-- ① sender → reliable-push -->
  <path d="M300,310 L300,440 L930,440 L930,504" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#m-side)"/>
  <text x="500" y="428" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">① register the push</text>
  <text x="500" y="462" font-size="13" fill="#115e59" text-anchor="middle">userId, policy, timeout, fallback → trackingId</text>

  <!-- reliable-push backend -->
  <g filter="url(#shadow)"><rect x="540" y="510" width="480" height="250" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/></g>
  <text x="780" y="544" font-size="20" font-weight="700" fill="#115e59" text-anchor="middle">reliable-push backend</text>
  <text x="780" y="566" font-size="14" fill="#0f766e" text-anchor="middle">tracks every push · never sends pushes</text>
  <!-- circuit breaker (per app) in front of the webhook -->
  <rect x="560" y="582" width="132" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="626" y="604" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Circuit breaker</text>
  <text x="626" y="624" font-size="12" fill="#475569" text-anchor="middle">per app: tracking</text>
  <text x="626" y="641" font-size="12" fill="#475569" text-anchor="middle">missing → stops</text>
  <text x="626" y="658" font-size="12" fill="#475569" text-anchor="middle">the webhooks</text>
  <line x1="712" y1="625" x2="694" y2="625" stroke="#dc2626" stroke-width="2.5" marker-end="url(#m-fall-sm)"/>
  <rect x="712" y="582" width="132" height="86" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="778" y="606" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Worker</text>
  <text x="778" y="628" font-size="12" fill="#475569" text-anchor="middle">watches the clock,</text>
  <text x="778" y="646" font-size="12" fill="#475569" text-anchor="middle">calls the webhook ⑤</text>
  <rect x="864" y="582" width="134" height="86" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="931" y="606" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">API</text>
  <text x="931" y="628" font-size="12" fill="#475569" text-anchor="middle">registers pushes,</text>
  <text x="931" y="646" font-size="12" fill="#475569" text-anchor="middle">devices and events</text>
  <!-- PostgreSQL cylinder -->
  <g>
    <path d="M700,690 L700,736 A80,12 0 0 0 860,736 L860,690" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <ellipse cx="780" cy="690" rx="80" ry="12" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="780" y="728" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Dashboard /admin (ops page and API, read-only except the fallback resume) -->
  <line x1="860" y1="717" x2="876" y2="717" stroke="#0d9488" stroke-width="2"/>
  <rect x="876" y="686" width="102" height="62" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="927" y="708" font-size="13.5" font-weight="700" fill="#115e59" text-anchor="middle">Dashboard</text>
  <text x="927" y="726" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">/admin</text>
  <text x="927" y="742" font-size="11.5" fill="#475569" text-anchor="middle">ops · circuits</text>

  <!-- ⑤ reliable-push → fallback service -->
  <line x1="560" y1="640" x2="386" y2="640" stroke="#dc2626" stroke-width="4" marker-end="url(#m-fall)"/>
  <text x="463" y="626" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">⑤ webhook</text>
  <text x="463" y="662" font-size="13" fill="#991b1b" text-anchor="middle">HMAC-signed</text>
  <text x="463" y="680" font-size="13" fill="#991b1b" text-anchor="middle">only if not met</text>

  <!-- Fallback service -->
  <g filter="url(#shadow)"><rect x="60" y="540" width="320" height="190" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/></g>
  <text x="220" y="574" font-size="19" font-weight="700" fill="#991b1b" text-anchor="middle">Your fallback service</text>
  <text x="220" y="596" font-size="14" fill="#b91c1c" text-anchor="middle">(external, yours)</text>
  <g font-size="14" fill="#334155">
    <text x="82" y="626">• gets userId, trackingId and</text>
    <text x="82" y="646">  the fallback you registered</text>
    <text x="82" y="672">• checks the signature</text>
    <text x="82" y="698">• sends the SMS / email ⑥</text>
  </g>

  <!-- ⑥ SMS -->
  <line x1="220" y1="730" x2="220" y2="764" stroke="#dc2626" stroke-width="4" marker-end="url(#m-fall)"/>
  <g filter="url(#shadow)"><rect x="80" y="770" width="280" height="60" rx="30" fill="#ffffff" stroke="#dc2626" stroke-width="2"/></g>
  <g transform="translate(104,784)">
    <rect x="0" y="0" width="38" height="28" rx="8" fill="#dc2626"/>
    <path d="M8,28 L6,38 L18,28 z" fill="#dc2626"/>
    <text x="19" y="19" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SMS</text>
  </g>
  <text x="156" y="797" font-size="14" font-weight="600" fill="#0f172a">⑥ the user gets an</text>
  <text x="156" y="816" font-size="14" font-weight="600" fill="#0f172a">SMS or an email</text>

  <!-- worker → clock -->
  <path d="M960,760 L960,862" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m-muted)"/>
  <text x="972" y="806" font-size="13" fill="#475569">the worker checks due</text>
  <text x="972" y="824" font-size="13" fill="#475569">pushes every 5 s</text>

  <!-- Clock and timeline -->
  <rect x="40" y="870" width="1520" height="210" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(160,975)">
    <circle r="74" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <!-- timeout wedge: 0 → 10 minutes -->
    <path d="M0,0 L0,-64 A64,64 0 0 1 55.4,-32 z" fill="#fde68a"/>
    <!-- trigger window wedge: 10 → 30 minutes -->
    <path d="M0,0 L55.4,-32 A64,64 0 0 1 0,64 z" fill="#fecaca" opacity="0.8"/>
    <g stroke="#78350f" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-66" x2="0" y2="-56"/><line x1="66" y1="0" x2="56" y2="0"/>
      <line x1="0" y1="66" x2="0" y2="56"/><line x1="-66" y1="0" x2="-56" y2="0"/>
    </g>
    <g stroke="#78350f" stroke-width="1.5" stroke-linecap="round">
      <line x1="33" y1="-57.2" x2="29" y2="-50.2"/><line x1="57.2" y1="-33" x2="50.2" y2="-29"/>
      <line x1="57.2" y1="33" x2="50.2" y2="29"/><line x1="33" y1="57.2" x2="29" y2="50.2"/>
      <line x1="-33" y1="57.2" x2="-29" y2="50.2"/><line x1="-57.2" y1="33" x2="-50.2" y2="29"/>
      <line x1="-57.2" y1="-33" x2="-50.2" y2="-29"/><line x1="-33" y1="-57.2" x2="-29" y2="-50.2"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-36" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="48" y2="-27.7" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#0f172a"/>
  </g>

  <text x="300" y="904" font-size="19" font-weight="700" fill="#78350f">When does the fallback fire?</text>
  <text x="1540" y="904" font-size="13" fill="#92400e" text-anchor="end">example: timeout 10 min, trigger window 20 min (the default)</text>

  <!-- timeline -->
  <rect x="340" y="952" width="560" height="22" fill="#fde68a"/>
  <rect x="900" y="952" width="500" height="22" fill="#fecaca"/>
  <rect x="1400" y="952" width="130" height="22" fill="#e5e7eb"/>
  <g stroke="#78350f" stroke-width="3">
    <line x1="340" y1="942" x2="340" y2="984"/>
    <line x1="900" y1="942" x2="900" y2="984"/>
    <line x1="1400" y1="942" x2="1400" y2="984"/>
  </g>
  <path d="M1530,963 L1546,963" stroke="#78350f" stroke-width="3" marker-end="url(#m-muted)"/>
  <g font-size="14" font-weight="700" fill="#78350f">
    <text x="340" y="936">t0 · push registered ①</text>
    <text x="900" y="936" text-anchor="middle">t0 + timeout · policy checked</text>
    <text x="1400" y="936" text-anchor="middle">+ trigger window</text>
  </g>
  <g font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="620" y="1002" font-weight="700" fill="#92400e">waiting for DELIVERED / READ ④</text>
    <text x="620" y="1022">event arrives in time → done, no fallback</text>
    <text x="1150" y="1002" font-weight="700" fill="#991b1b">policy not met → webhook ⑤</text>
    <text x="1150" y="1022">failed calls retried after 1, 2, 4, 8 min</text>
    <text x="1470" y="1002" font-weight="700" fill="#374151">too late</text>
    <text x="1470" y="1022">expired, no call</text>
    <text x="1150" y="1040" fill="#991b1b">circuit open (tracking missing) → expired, no call</text>
  </g>
  <text x="800" y="1068" font-size="13.5" fill="#475569" text-anchor="middle">Policy NOT_DELIVERED is met by DELIVERED or READ · NOT_READ only by READ · policy and timeout never reach the device</text>
</svg>
