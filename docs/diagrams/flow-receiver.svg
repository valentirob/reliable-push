" cy="332" r="8.6" fill="#5b6478"/><text x="494" y="335.24" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">5</text></g><line x1="476" y1="368" x2="191.667" y2="368" stroke="#5b6478" stroke-width="1.0" stroke-dasharray="4,3" marker-end="url(#flow-receiver-m-muted)"/><rect x="221.733" y="351" width="201.2" height="14" fill="#f5f7fb"/><text class="bd" x="322.333" y="361" text-anchor="middle" fill="#5b6478">2xx within 10 s: FALLBACK_TRIGGERED</text><g><circle cx="466" cy="368" r="8.6" fill="#5b6478"/><text x="466" y="371.24" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">6</text></g><rect x="52" y="394" width="562.667" height="40" rx="4" fill="#e9edf4" stroke="rgba(23,32,51,0.15)" stroke-width="0.8"/><text class="bd" x="333.333" y="411" text-anchor="middle" font-style="italic">final 4xx: FALLBACK_FAILED · 5xx, 408, 429, timeout:</text><text class="bd" x="333.333" y="425" text-anchor="middle" font-style="italic">retried after 1, 2, 4, 8 min inside the window</text><line x1="40" y1="472" x2="920" y2="472" stroke="rgba(23,32,51,0.1)" stroke-width="0.8"/><text class="lh" x="40" y="490">LEGEND</text><rect x="40" y="500" width="14" height="10" rx="2" fill="rgba(11,114,104,0.08)" stroke="#0b7268"/><text class="lg" x="60" y="508">reliable-push</text><rect x="142.344" y="500" width="14" height="10" rx="2" fill="rgba(180,35,24,0.06)" stroke="#b42318"/><text class="lg" x="162.344" y="508">Your fallback receiver</text><rect x="285.08" y="500" width="14" height="10" rx="2" fill="rgba(23,32,51,0.03)" stroke="rgba(23,32,51,0.3)"/><text class="lg" x="305.08" y="508">Your SMS / email provider</text><line x1="441.28" y1="505" x2="463.28" y2="505" stroke="#b42318" stroke-width="1.4" marker-end="url(#flow-receiver-m-alert)"/><text class="lg" x="471.28" y="508">Fallback</text><line x1="531.184" y1="505" x2="553.184" y2="505" stroke="#5b6478" stroke-width="1.2" marker-end="url(#flow-receiver-m-muted)"/><text class="lg" x="561.184" y="508">Call / data