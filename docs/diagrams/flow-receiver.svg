<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" width="960" height="532" role="img" aria-labelledby="flow-receiver-title flow-receiver-desc" class="flow-receiver">
<title id="flow-receiver-title">Your receiver sends the SMS or email</title>
<desc id="flow-receiver-desc">The worker sends a signed POST to your fallback receiver; the receiver verifies the HMAC signature on the raw body and the timestamp, answers a repeated Idempotency-Key without sending again, sends or enqueues the SMS or email and answers 2xx within 10 s; a final 4xx ends as FALLBACK_FAILED, while 5xx, 408, 429 and timeouts are retried inside the trigger window.</desc>
