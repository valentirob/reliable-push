<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" width="960" height="692" role="img" aria-labelledby="worker-title worker-desc" class="worker">
<title id="worker-title">How a worker claims and dispatches a fallback</title>
<desc id="worker-desc">Each worker replica first checks every app&#x27;s circuit under an advisory lock and expires the due rows of an open or suspended app without calling the webhook, then claims the other due rows with SKIP LOCKED and a lease, calls the receiver only inside the trigger window, and writes the outcome fenced on the lease; a replica that dies loses its lease and another one re-claims the row.</desc>
