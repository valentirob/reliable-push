<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="components-title components-desc" class="components">
<title id="components-title">Components and how they relate</title>
<desc id="components-desc">Your sender backend pushes through FCM and APNs and registers each tracked push with the reliable-push api role; the app&#x27;s SDK registers the device and sends events with a device JWT after the api verifies the identity provider&#x27;s ID token; the worker role reads PostgreSQL and calls your fallback receiver with an HMAC-signed webhook.</desc>
