<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" width="960" height="524" role="img" aria-labelledby="helm-title helm-desc" class="helm">
<title id="helm-title">Helm chart: combined and split mode</title>
<desc id="helm-desc">In combined mode one Deployment runs pods with the api and worker profiles behind the Service; in split mode the API pods take the Service traffic and separate worker pods get none; both modes use PostgreSQL and the worker pods call the fallback receiver.</desc>
