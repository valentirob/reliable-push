<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="flow-payload-title flow-payload-desc" class="flow-payload">
<title id="flow-payload-title">Tracking id and tracked payload</title>
<desc id="flow-payload-desc">For each push that needs tracking, your backend asks the payload jar for a new tracking id, generated locally without any network call, and builds the push with it: an APNs alert with mutable-content and a top-level rp_tid, or an FCM data-only, high-priority message with rp_tid, title and body.</desc>
