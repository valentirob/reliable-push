<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 514" width="960" height="514" role="img" aria-labelledby="integration-title integration-desc" class="integration">
<title id="integration-title">What your backend does, in order</title>
<desc id="integration-desc">Your backend generates a tracking id with the payload jar, registers the push with reliable-push with a 1 s timeout, always sends the push through FCM or APNs with rp_tid, the device SDK reports DELIVERED and then READ, and when the push is due with its policy unmet reliable-push calls your fallback receiver with a signed webhook.</desc>
