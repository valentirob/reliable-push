<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ios-title ios-desc" class="ios">
<title id="ios-title">iOS SDK</title>
<desc id="ios-desc">An APNs alert with mutable-content and rp_tid wakes the Notification Service Extension: it persists DELIVERED in the App Group, sends it once without renewing the token, and hands the notification to the system within 2 s; pushes without rp_tid stay with your own extension code; in the app, ensureRegistered is the only token renewal and trackOpen queues READ, which the app flushes one at a time.</desc>
