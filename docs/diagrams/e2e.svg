<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 816" width="960" height="816" role="img" aria-labelledby="e2e-title e2e-desc" class="e2e">
<title id="e2e-title">One notification, end to end</title>
<desc id="e2e-desc">The sender backend creates a tracking id, registers the push with reliable-push within a 1 s timeout and always sends it through FCM or APNs with rp_tid; the app&#x27;s SDK reports DELIVERED and READ; if the policy is not met by dueAt, the worker checks the app&#x27;s circuit, claims the row and calls the fallback receiver with a signed webhook.</desc>
