<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="dashboard-title dashboard-desc" class="dashboard">
<title id="dashboard-title">Ops dashboard</title>
<desc id="dashboard-desc">The browser loads the static /admin/ page and calls the /v1/admin API with the admin key; the API reads PostgreSQL for live windows, search, detail, older days and circuits, and its only write is resuming an app&#x27;s fallbacks; worker jobs write fallback attempts, the nightly daily_stats rollup and the circuit history, and the retention job checks the rollup first.</desc>
