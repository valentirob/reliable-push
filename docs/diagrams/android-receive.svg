<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-labelledby="android-receive-title android-receive-desc" class="android-receive">
<title id="android-receive-title">Android SDK: receiving a tracked push</title>
<desc id="android-receive-desc">An FCM data-only message reaches your FirebaseMessagingService, which hands it to ReliablePushMessaging; without rp_tid your own handling continues; a tracked message becomes a notification built with your customizer, gated on its final channel; if the system would not show it nothing is recorded, otherwise DELIVERED is persisted on disk, the local notification is posted and one event POST is sent; any SDK error still posts a minimal notification.</desc>
