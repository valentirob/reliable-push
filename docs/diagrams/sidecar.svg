<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="sidecar-title sidecar-desc" class="sidecar">
<title id="sidecar-title">The sidecar principle</title>
<desc id="sidecar-desc">Your backend keeps sending pushes through FCM and APNs as today; it also registers each tracked push with reliable-push, the app&#x27;s SDK reports DELIVERED and READ, and only when a push is not confirmed in time reliable-push calls your fallback receiver with a signed webhook.</desc>
