<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="states-title states-desc" class="states">
<title id="states-title">Notification states</title>
<desc id="states-desc">A registered notification starts PENDING, or closes at once as NO_DEVICE_REGISTERED; DELIVERED and READ events move it forward; the sender can cancel it; when it is due with its policy unmet the worker dispatches the webhook, retrying with backoff, and it ends FALLBACK_TRIGGERED, FALLBACK_FAILED or FALLBACK_EXPIRED.</desc>
