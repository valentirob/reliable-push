<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="backend-title backend-desc" class="backend">
<title id="backend-title">Backend modules</title>
<desc id="backend-desc">Every instance serves the HTTP API through one filter chain into the notification, device and tracking controllers; worker instances run the fallback scheduler, which first asks the circuit breaker and then claims due rows, the dispatcher and the signed webhook client, and the retention job; all of them use PostgreSQL, and the per-app configuration feeds the controllers and the dispatcher.</desc>
