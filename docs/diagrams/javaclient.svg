<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="javaclient-title javaclient-desc" class="javaclient">
<title id="javaclient-title">Java sender client and payload jar</title>
<desc id="javaclient-desc">Your Java backend asks the payload jar for a tracking id and a tracked APNs or FCM payload, registers the push with reliable-push through the immutable SenderClient with a 1 s timeout, and always sends the push with rp_tid through your own APNs or FCM client.</desc>
