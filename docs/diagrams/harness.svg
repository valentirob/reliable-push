<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576" role="img" aria-labelledby="harness-title harness-desc" class="harness">
<title id="harness-title">Harness and web console</title>
<desc id="harness-desc">Local only: docker compose runs PostgreSQL, the api and two workers, and the harness with the web console, a fake sender and device simulator, a fallback receiver that checks signatures, the scenario runner, a device proxy that can cut the iOS Simulator off, and optional real FCM and APNs senders; the Android emulator and the iOS Simulator run the sample apps against the same api.</desc>
