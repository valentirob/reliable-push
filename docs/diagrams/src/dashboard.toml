# Ops dashboard: overview §5.
title = "Ops dashboard"
desc = "The browser loads the static /admin/ page and calls the /v1/admin API with the admin key; the API reads PostgreSQL for live windows, search, detail, older days and circuits, and its only write is resuming an app's fallbacks; worker jobs write fallback attempts, the nightly daily_stats rollup and the circuit history, and the retention job checks the rollup first."
width = 960
height = 448

