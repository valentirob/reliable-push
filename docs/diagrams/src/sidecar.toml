# The sidecar principle: README "How it works" and overview §1.
title = "The sidecar principle"
desc = "Your backend keeps sending pushes through FCM and APNs as today; it also registers each tracked push with reliable-push, the app's SDK reports DELIVERED and READ, and only when a push is not confirmed in time reliable-push calls your fallback receiver with a signed webhook."
