# Backend modules: overview §4.
title = "Backend modules"
desc = "Every instance serves the HTTP API through one filter chain into the notification, device and tracking controllers; worker instances run the fallback scheduler, which first asks the circuit breaker and then claims due rows, the dispatcher and the signed webhook client, and the retention job; all of them use PostgreSQL, and the per-app configuration feeds the controllers and the dispatcher."
width = 960
height = 520

