# reliable-push at a glance: README, overview, presentation. Animated: the numbered steps play in order (CSS only, so
# it plays where GitHub shows the SVG as an image); the PNG next to it is the static frame (reduced motion).
slug = "glance"
output = "../images/reliable-push-at-a-glance.svg"
png = "../images/reliable-push-at-a-glance.png"
title = "reliable-push at a glance"
desc = "Your backend sends pushes through FCM and APNs to an iPhone and an Android phone, as today. For each tracked push it generates a tracking id with the payload jar, registers the push with the reliable-push backend with a 1 s timeout, and always sends the push with that id. On the iPhone the Notification Service Extension saves DELIVERED, sends it once and hands the notification back within 2 s; on Android the SDK turns a data message into a local notification after saving DELIVERED. The tracking module in each app reports DELIVERED when the push arrives and READ when it is tapped. If the policy is not met before the timeout, the reliable-push worker calls your signed fallback webhook, and your fallback service sends an SMS or an email. A per-app circuit breaker stops the fallbacks of an app whose delivery tracking is missing, so an outage does not turn into a storm of needless SMS. The ops dashboard shows each app's circuit. The numbered steps light up one after the other."
width = 1600
height = 1320
animate = true
step_seconds = 2
css = [
  ".glance .cur{animation:glance-cur 14s linear infinite}",
  "@keyframes glance-cur{0%{transform:translateX(0)}57.1%{transform:translateX(560px)}71.4%{transform:translateX(640px)}100%{transform:translateX(640px)}}",
  "@media (prefers-reduced-motion: reduce){.glance .cur{display:none}}",
]

