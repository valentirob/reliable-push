# Notification states: overview §3 and architecture.md.
title = "Notification states"
desc = "A registered notification starts PENDING, or closes at once as NO_DEVICE_REGISTERED; DELIVERED and READ events move it forward; the sender can cancel it; when it is due with its policy unmet the worker dispatches the webhook, retrying with backoff, and it ends FALLBACK_TRIGGERED, FALLBACK_FAILED or FALLBACK_EXPIRED."
width = 960
height = 520

