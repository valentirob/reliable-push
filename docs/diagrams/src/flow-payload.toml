# Flow in detail, steps B1 and B2: tracking id and tracked payload (docs/flow-in-detail.md).
title = "Tracking id and tracked payload"
desc = "For each push that needs tracking, your backend asks the payload jar for a new tracking id, generated locally without any network call, and builds the push with it: an APNs alert with mutable-content and a top-level rp_tid, or an FCM data-only, high-priority message with rp_tid, title and body."
width = 960
height = 344

[legend]
input = "Your backend"
backend = "payload jar"
store = "Tracked push"
dashed = "Return"

