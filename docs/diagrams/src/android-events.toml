# Android SDK, registration and events: overview §7.
title = "Android SDK: registration and events"
desc = "ensureRegistered returns at once and, only when needed, registers the device with an ID token or refreshes its token, kept encrypted with the Android Keystore; DELIVERED and READ events go out one at a time from the SDK thread, offline and server errors are retried by JobScheduler, and a 401 stores renewalNeeded and keeps the events for the next ensureRegistered."
width = 960
height = 568

