# Load tests: overview §11.
title = "Load tests"
desc = "A Gatling container on the same compose network drives 500 notifications and 1,000 events per second against an api limited to 2 CPUs and 1 GiB, the workers deliver the burst of fallbacks to the harness receiver, the BurstDrainProbe reads the workers' Prometheus endpoint, and the results land in harness/build/load/summary.json."
