# Components and how they relate: overview §2 and architecture.md.
title = "Components and how they relate"
desc = "Your sender backend pushes through FCM and APNs and registers each tracked push with the reliable-push api role; the app's SDK registers the device and sends events with a device JWT after the api verifies the identity provider's ID token; the worker role reads PostgreSQL and calls your fallback receiver with an HMAC-signed webhook."
