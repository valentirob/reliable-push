# Android SDK, receiving a tracked push: overview §7.
title = "Android SDK: receiving a tracked push"
desc = "An FCM data-only message reaches your FirebaseMessagingService, which hands it to ReliablePushMessaging; without rp_tid your own handling continues; a tracked message becomes a notification built with your customizer, gated on its final channel; if the system would not show it nothing is recorded, otherwise DELIVERED is persisted on disk, the local notification is posted and one event POST is sent; any SDK error still posts a minimal notification."
width = 960
height = 512

