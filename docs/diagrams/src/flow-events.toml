# Flow in detail, step B6: delivery and read reach the sidecar (docs/flow-in-detail.md).
title = "DELIVERED and READ reach reliable-push"
desc = "The SDK sends the queued DELIVERED and READ events with the device token, one to fifty per call; each event is ACCEPTED and moves the state, LATE when it no longer can, or ignored as a duplicate, unknown or foreign; an accepted DELIVERED meets the NOT_DELIVERED policy and an accepted READ meets both, which closes the notification without a fallback."
