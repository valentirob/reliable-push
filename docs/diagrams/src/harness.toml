# Harness and web console: overview §9.
title = "Harness and web console"
desc = "Local only: docker compose runs PostgreSQL, the api and two workers, and the harness with the web console, a fake sender and device simulator, a fallback receiver that checks signatures, the scenario runner, a device proxy that can cut the iOS Simulator off, and optional real FCM and APNs senders; the Android emulator and the iOS Simulator run the sample apps against the same api."
