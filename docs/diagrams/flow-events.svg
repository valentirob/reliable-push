<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="flow-events-title flow-events-desc" class="flow-events">
<title id="flow-events-title">DELIVERED and READ reach reliable-push</title>
<desc id="flow-events-desc">The SDK sends the queued DELIVERED and READ events with the device token, one to fifty per call; each event is ACCEPTED and moves the state, LATE when it no longer can, or ignored as a duplicate, unknown or foreign; an accepted DELIVERED meets the NOT_DELIVERED policy and an accepted READ meets both, which closes the notification without a fallback.</desc>
