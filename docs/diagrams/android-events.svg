<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648" role="img" aria-labelledby="android-events-title android-events-desc" class="android-events">
<title id="android-events-title">Android SDK: registration and events</title>
<desc id="android-events-desc">ensureRegistered returns at once and, only when needed, registers the device with an ID token or refreshes its token, kept encrypted with the Android Keystore; DELIVERED and READ events go out one at a time from the SDK thread, offline and server errors are retried by JobScheduler, and a 401 stores renewalNeeded and keeps the events for the next ensureRegistered.</desc>
