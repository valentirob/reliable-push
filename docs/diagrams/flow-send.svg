<title id="flow-send-title">Send the push, as today</title>
<desc id="flow-send-desc">Your backend sends the tracked push itself, with its own APNs and FCM credentials and clients, whatever the registration answered; APNs and FCM deliver it to the iPhone and the Android phone; reliable-push is not on this path.</desc>
