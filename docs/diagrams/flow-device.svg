<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 634" width="960" height="634" role="img" aria-labelledby="flow-device-title flow-device-desc" class="flow-device">
<title id="flow-device-title">The device registers</title>
<desc id="flow-device-desc">At start, foreground or login the app calls ensureRegistered, which returns at once; in the background the SDK gets the signed-in user&#x27;s ID token from your login, registers the device with reliable-push, which verifies the token and takes the user id from it, and keeps the device token in secure storage; near expiry, or after an event was refused with 401, the next ensureRegistered refreshes it.</desc>
