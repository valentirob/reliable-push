<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="loadtest-title loadtest-desc" class="loadtest">
<title id="loadtest-title">Load tests</title>
<desc id="loadtest-desc">A Gatling container on the same compose network drives 500 notifications and 1,000 events per second against an api limited to 2 CPUs and 1 GiB, the workers deliver the burst of fallbacks to the harness receiver, the BurstDrainProbe reads the workers&#x27; Prometheus endpoint, and the results land in harness/build/load/summary.json.</desc>
