<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-labelledby="flow-register-title flow-register-desc" class="flow-register">
<title id="flow-register-title">Register the push with reliable-push</title>
<desc id="flow-register-desc">Before sending, your backend registers the push with its tracking id, user id, policy, timeout and fallback text, with a 1 s timeout; reliable-push stores it once per tracking id and opens it as PENDING with a due time when the user has an active device, or closes it as NO_DEVICE_REGISTERED; the answer is informative only: whatever happens, the backend sends the push.</desc>
